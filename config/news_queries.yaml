# Google News RSS queries. One bucket per Outlook/Live news category.
# URL shape: https://news.google.com/rss/search?q={query} when:{freshness_days}d&hl=en-US&gl=US&ceid=US:en
#
# Write queries the way a newsroom would title the story: two to four plain words.
# Keyword lists ("WTI Brent crude oil price OPEC") match SEO pages and price tables, not news.
# Event queries (Beige Book, Jackson Hole, FOMC minutes) return rows only around the event;
# an empty result outside that window is expected.
# Which rows reach the pack is decided at read time by config/news_sources.yaml.

freshness_days: 2

buckets:
  - category: rates
    queries:
      - "Federal Reserve"
      - "Fed rate decision"
      - "Treasury yields"
      - "Fed chair"
      - "FOMC minutes"
      - "Beige Book"
      - "Jackson Hole Fed"          # bare "Jackson Hole" returns the local paper

  - category: inflation
    queries:
      - "US inflation"
      - "CPI report"
      - "PCE inflation"

  - category: growth
    queries:
      - "US jobs report"
      - "jobless claims"
      - "US economy"

  - category: fiscal
    queries:
      - "budget deficit"
      - "national debt"

  - category: credit
    queries:
      - "junk bonds"
      - "credit markets"

  - category: fx
    queries:
      - "dollar index"
      - "yen dollar"
      - "euro dollar"
      - "emerging market currencies"

  - category: commodities
    queries:
      - "oil prices"
      - "gold prices"
      - "copper prices"

  - category: trade
    queries:
      - "tariffs"
      - "US trade talks"            # bare "trade talks" returns sports trades

  - category: treasury
    queries:
      - "Treasury auction"
      - "Treasury refunding"
      - "Treasury Secretary"

  - category: corporate
    queries:
      - "earnings Wall Street"
      - "stocks earnings guidance"

  - category: energy
    queries:
      - "OPEC"
      - "natural gas prices"
      - "LNG"

  - category: sector
    queries:
      - "stock market today"
      - "sector rotation"

  - category: thematic
    queries:
      - "AI stocks"
      - "chip stocks"

  - category: ecb
    queries:
      - "ECB"
      - "Lagarde"

  - category: boe
    queries:
      - "Bank of England"

  - category: boj
    queries:
      - "Bank of Japan"

  - category: pboc
    queries:
      - "PBOC"
      - "China economy"

  - category: geo
    queries:
      - "Middle East conflict"
      - "shipping attacks"
      - "Russia Ukraine war"
      - "China Taiwan"
      - "sanctions"
