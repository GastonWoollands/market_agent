# Instrument catalogs. Jobs seed `universe` / `universe_member` from this file.
# Yahoo symbols: indices use ^ prefix; ETFs are plain tickers.

tape:
  description: Live tape, Dynamics, Risk-On proxies. Daily bars + quotes + 5m extended hours.
  instruments:
    - { ticker: SPY, yahoo: SPY, name: SPDR S&P 500, asset_class: etf, role: benchmark }
