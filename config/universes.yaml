# Live header composition (Day 3). Movers are tape names with role sector or group.
# Labels are display aliases only; ingest still uses ticker/yahoo from tape.
# intl_section lists international indices shown in the global markets section.
live:
  header:
    - { ticker: "^GSPC", label: S&P 500 }
    - { ticker: IWM, label: Russell 2000 }
    - { ticker: "^VIX", label: VIX }
    - { ticker: TLT, label: 20Y+ Treasury }
    - { ticker: DXY, label: Dollar (DXY) }
    - { ticker: HYG, label: High yield }
  mover_roles: [sector, group]
  # Same-day Treasury yields from Yahoo (level in %, move in bp). FRED stays the official series.
  yields_section:
    - { ticker: "^IRX", label: 3M bill }
    - { ticker: "^FVX", label: 5Y }
    - { ticker: "^TNX", label: 10Y }
    - { ticker: "^TYX", label: 30Y }
  intl_section:
    - { ticker: EEM, label: Emerging Markets }
    - { ticker: "^N225", label: Nikkei }
    - { ticker: "^GDAXI", label: DAX }
    - { ticker: "^FTSE", label: FTSE }
    - { ticker: "^HSI", label: Hang Seng }

valuation:
  description: Opportunity + Valuation screen. Built from SEC facts (Day 11+), not this static list.
  min_revenue_usd: 1000000000
  exchanges: [NYSE, Nasdaq, NYSE American]
  rebuild: monthly

watchlist:
  description: User-managed. Seed a few names so Watchlist is not empty on first run.
  instruments:
    - { ticker: NVDA, yahoo: NVDA, name: NVIDIA }
    - { ticker: AAPL, yahoo: AAPL, name: Apple }
    - { ticker: MSFT, yahoo: MSFT, name: Microsoft }
    - { ticker: AMZN, yahoo: AMZN, name: Amazon }
    - { ticker: SPY, yahoo: SPY, name: SPDR S&P 500 }

# Contracted universe D. Membership is not seeded here; compute_quant may flag
# valuation names that already pass these rules. Yahoo gems ingest is a later phase.
gems:
  description: Small/mid names with usable XBRL. Not seed-stage. Membership not built yet.
  min_market_cap_usd: 300000000
  max_market_cap_usd: 2000000000
  min_revenue_usd: 50000000
  min_revenue_growth_yoy: 0.15
  min_fcf_yield: 0.04
  max_debt_to_equity: 0.5
