# Equity-implied credit bucket calibration set (Phase 1.11, Northstar §9).
#
# One row per rated US issuer. `bucket` is the S&P letter grade without modifiers
# (Moody's / Fitch converted when S&P was not found). The model places each name's
# distance to default on the median DD of these buckets.
#
# fit: false keeps a row out of the anchors. Low-confidence rows are out by default;
# exclusions follow Northstar §9 (financial-like balance sheets). `holdout` rows are
# scored but never fitted, to check the model out of sample.
#
# Verified by web research on 2026-10-31. REVIEW BEFORE SHIP: confirm or correct
# rating / as_of / source; set confidence to high when you have checked a row.

version: "2026-10-31"

# Never scored: liabilities are deposits, float, policy reserves or customer custody,
# not claims that force default (Northstar §9).
exclude_sectors: [Financials, Real Estate]
# Captive finance arms put a lender's balance sheet on an industrial issuer.
exclude_tickers: [F, GM, COIN]

