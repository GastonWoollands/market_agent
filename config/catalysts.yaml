  # Source: federalreserve.gov/monetarypolicy/fomccalendars.htm (2026; 2027 read 2026-10-30).
  # 2027 is tentative: "Each meeting date is tentative until confirmed at the meeting
  # immediately preceding it."
  - { date: 2026-01-28, title: FOMC decision, sep: false }
