# Hand-curated calendar. Refresh yearly. Do not scrape this.
# Times are America/New_York. Earnings come from Finnhub at runtime, not this file.
# Remaining 2026 dates as of 2026-08-27. Decision day = second day of two-day meetings.

timezone: America/New_York

fomc:
  # Decision day (second day of the meeting). Statement ~14:00 ET, presser ~14:30.
  # Source: Federal Reserve tentative 2026 schedule.
