# Hand-curated calendar. Refresh yearly. Do not scrape this.
# Times are America/New_York. Earnings come from Finnhub at runtime, not this file.
# Decision day = second (last) day of two-day meetings.
# Only dates published on the official calendar are listed; never estimate one.
# 2027 dates read from the official pages on 2026-10-30. Not yet published then
# (add when they are): JOLTS, FOMC minutes, Beige Book, Jackson Hole, Treasury
# refunding. ISM's calendar sits behind a login, so ISM 2027 is not listed.
# ingest_calendar warns when a kind's last listed date is near.

timezone: America/New_York

# Release time (ET) per kind; an item's own `time:` wins. Non-US central banks are left
# blank on purpose (their ET time shifts with DST mismatches).
default_times:
  fomc: "14:00"
  cpi: "08:30"
  pce: "08:30"
  nfp: "08:30"
  gdp: "08:30"
  jolts: "10:00"
  minutes: "14:00"
  beige_book: "14:00"
  ism: "10:00"
  treasury: "08:30"

fomc:
