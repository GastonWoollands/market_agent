# FRED levers for Live + Outlook. Jobs upsert into macro_series / macro_observation.
# pack_view tells analytics/macro_pack.py how to expose the series to the writer.
# show_on_live: false keeps the Live sidebar from listing every pack-only series.
# API: https://api.stlouisfed.org/fred/series/observations

series:
  - id: DGS10
    name: 10Y Treasury yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: The discount rate on everything. Rising 10Y compresses long-duration valuations (tech, utilities, REITs).
    watch: [XLK, XLU, XLRE, XLF]

  - id: DGS2
    name: 2Y Treasury yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: Front-end policy path. Tracks Fed funds expectations more tightly than the 10Y.

  - id: DGS3MO
    name: 3M Treasury yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    insight: Cash / T-bill rate. The front of the curve vs DGS2 and DFF.

  - id: DGS5
    name: 5Y Treasury yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    show_on_live: false
    insight: Belly of the curve. Bridges the policy path (2Y) and the discount rate (10Y).

  - id: DGS30
    name: 30Y Treasury yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: Long-duration discount rate. Fiscal and term-premium sensitive.

  - id: T10Y2Y
    name: Curve 10Y-2Y
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: Yield curve slope. Inversion has historically preceded US recessions; steepening often marks policy easing.

  - id: DFII10
    name: 10Y real yield
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: Inflation-adjusted discount rate. Higher real yields compete with equities and weigh on gold.

  - id: T10YIE
    name: 10Y breakeven
    unit: percent
    category: inflation
    region: us
    pack_view: yield_bp
    spine: true
    insight: Market-implied average inflation over 10 years (nominal 10Y minus TIPS).

  - id: T5YIE
    name: 5Y breakeven
    unit: percent
    category: inflation
    region: us
    pack_view: yield_bp
    insight: Market-implied average inflation over 5 years. Near-term inflation path vs T10YIE.

  - id: T5YIFR
    name: 5Y5Y forward inflation
    unit: percent
    category: inflation
    region: us
    pack_view: yield_bp
    show_on_live: false
    insight: 5-year inflation beginning 5 years from now. Long-run inflation anchor.

  - id: DFF
    name: Fed funds effective
    unit: percent
    category: rates
    region: us
    pack_view: yield_bp
    spine: true
    insight: Overnight policy rate actually printed in the funds market.

  - id: VIXCLS
    name: VIX
    unit: index
    category: volatility
    region: us
    pack_view: level
    insight: Implied 30-day S&P 500 vol. Sustained prints under ~15 are complacent; spikes mark risk-off.

  - id: BAMLH0A0HYM2
    name: HY OAS
    unit: percent
    category: credit
    region: us
    pack_view: yield_bp
    spine: true
    insight: High-yield option-adjusted spread. Tight spreads = credit risk-on; widening is a stress signal.

  - id: BAMLC0A0CM
    name: IG OAS
    unit: percent
    category: credit
    region: us
    pack_view: yield_bp
    show_on_live: false
    insight: Investment-grade option-adjusted spread. Pair with HY OAS for credit quality split.

  - id: DTWEXBGS
    name: Dollar (broad)
    unit: index
    category: fx
    region: us
    pack_view: level
    spine: true
    insight: Trade-weighted USD (DXY). A strong dollar tightens global financial conditions and pressures EM assets.

  - id: DCOILWTICO
    name: WTI Crude
    unit: usd_per_barrel
    category: commodities
    region: us
    pack_view: level
    insight: Spot WTI. Energy equities (XLE) and inflation prints track this with a lag.

  - id: GOLDAMGBD228NLBM
    name: Gold spot
    unit: usd_per_oz
    category: commodities
    region: us
    pack_view: level
    spine: false
    insight: London gold fixing. Structural hedge against fiscal risk; EM central banks accumulate during dollar strength cycles. Fallback GOLDPMGBD228NLBM (PM fixing) if this series fails.
    watch: [GLD]

  - id: DCOILBRENTEU
    name: Brent Crude
    unit: usd_per_barrel
    category: commodities
    region: intl
    pack_view: level
    show_on_live: false
    insight: Global oil benchmark. Tracks geopolitical premium and OPEC+ supply dynamics vs WTI.

  - id: DHHNGSP
    name: Henry Hub Natural Gas
    unit: usd_per_mmbtu
    category: commodities
    region: us
    pack_view: level
    show_on_live: false
    insight: US natural gas spot. Winter heating demand and LNG export capacity drive seasonal volatility.

  - id: PCOPPUSDM
    name: Copper spot
    unit: usd_per_mt
    category: commodities
    region: intl
    pack_view: level
    insight: Dr. Copper signals global industrial demand. China infrastructure and EV battery production are primary drivers.

  - id: CPIAUCSL
    name: CPI all items
    unit: index
    category: inflation
    region: us
    pack_view: index_yoy
    spine: true
    insight: Headline CPI. Pack exposes YoY/MoM; do not narrate the raw index as a percent.
    frequency: monthly

  - id: CPILFESL
    name: Core CPI
    unit: index
    category: inflation
    region: us
    pack_view: index_yoy
    insight: CPI excluding food and energy. Pack exposes YoY/MoM.
    frequency: monthly

  - id: PCEPI
    name: Headline PCE
    unit: index
    category: inflation
    region: us
    pack_view: index_yoy
    insight: Headline PCE price index. Pack exposes YoY/MoM.
    frequency: monthly

  - id: PCEPILFE
    name: Core PCE
    unit: index
    category: inflation
    region: us
    pack_view: index_yoy
    spine: true
    insight: Fed's preferred inflation gauge excluding food and energy. Pack exposes YoY/MoM.
    frequency: monthly

  - id: UNRATE
    name: Unemployment rate
    unit: percent
    category: growth
    region: us
    pack_view: level
    insight: U-3 unemployment. Labor softening is a late-cycle / easing signal.
    frequency: monthly

  - id: PAYEMS
    name: Nonfarm payrolls
    unit: thousands
    category: growth
    region: us
    pack_view: count_diff
    spine: true
    insight: All employees, total nonfarm. Narrate the monthly change (thousands), not the level.
    frequency: monthly

  - id: ICSA
    name: Initial claims
    unit: thousands
    category: growth
    region: us
    pack_view: count_diff
    spine: true
    scale: 0.001
    insight: Weekly initial jobless claims (FRED persons, scaled to thousands). Narrate print_change.
    frequency: weekly

  - id: DGORDER
    name: Durable goods orders
    unit: millions_usd
    category: growth
    region: us
    pack_view: mom_pct
    insight: Monthly new orders for durable manufactured goods. Capital spending proxy; ex-transportation removes aircraft volatility.
    frequency: monthly

  - id: NEWORDER
    name: Durable goods ex-transportation
    unit: millions_usd
    category: growth
    region: us
    pack_view: mom_pct
    insight: Core durable goods orders stripping aircraft. Better signal for sustained manufacturing demand.
    frequency: monthly

  - id: INDPRO
    name: Industrial production
    unit: index
    category: growth
    region: us
    pack_view: mom_pct
    show_on_live: false
    insight: Manufacturing, mining, utilities output. Tracks capacity utilization and factory bottlenecks.
    frequency: monthly

  - id: UMCSENT
    name: Michigan consumer sentiment
    unit: index
    category: growth
    region: us
    pack_view: level
    show_on_live: false
    insight: Consumer confidence survey. Forward-looking spending proxy; inflation expectations component is Fed-watched.
    frequency: monthly

  - id: GFDEGDQ188S
    name: Federal debt / GDP
    unit: percent
    category: fiscal
    region: us
    pack_view: level
    insight: Gross federal debt as a percent of GDP. Quarterly; lag_days will be large — say so.
    frequency: quarterly

  - id: WALCL
    name: Fed total assets
    unit: millions_usd
    category: liquidity
    region: us
    pack_view: level
    spine: true
    insight: Federal Reserve balance sheet. QE expands (liquidity injection), QT contracts (tightening). Net liquidity = WALCL - (RRP + TGA).
    frequency: weekly

  - id: RRPONTSYD
    name: Reverse repo operations
    unit: millions_usd
    category: liquidity
    region: us
    pack_view: level
    insight: Overnight RRP facility usage. High RRP = excess reserves parked at Fed (liquidity not flowing to markets).
    frequency: daily

  - id: WTREGEN
    name: Treasury General Account
    unit: millions_usd
    category: liquidity
    region: us
    pack_view: level
    insight: Treasury's operating cash at the Fed. Rising TGA drains liquidity; falling TGA injects as Treasury spends.
    frequency: daily

  - id: TOTRESNS
    name: Bank reserves
    unit: millions_usd
    category: liquidity
    region: us
    pack_view: level
    show_on_live: false
    insight: Bank reserves held at the Fed. Tracks QE/QT effects; low reserves signal liquidity stress.
    frequency: weekly

  - id: ECBDFR
    name: ECB deposit rate
    unit: percent
    category: rates
    region: ea
    pack_view: yield_bp
    insight: Euro area policy floor (deposit facility). Context for US financial conditions, not an EU tape.

  - id: DEXUSEU
    name: USD per EUR
    unit: usd_per_eur
    category: fx
    region: ea
    pack_view: fx
    show_on_live: false
    insight: Dollar vs euro spot. Daily; fresher than monthly OECD yields.

  - id: DEXJPUS
    name: JPY per USD
    unit: jpy_per_usd
    category: fx
    region: jp
    pack_view: fx
    insight: "Yen per dollar (JPY per USD; a rise is a weaker yen). A weak yen often tracks US-Japan rate differentials."

  - id: DEXUSUK
    name: USD per GBP
    unit: usd_per_gbp
    category: fx
    region: uk
    pack_view: fx
    show_on_live: false
    insight: Dollar vs sterling spot.

  - id: DEXMXUS
    name: MXN per USD
    unit: mxn_per_usd
    category: fx
    region: mx
    pack_view: fx
    insight: Peso per dollar. Mexico is the top US trade partner; peso strength signals USMCA stability and remittance flows.

  - id: DEXBZUS
    name: BRL per USD
    unit: brl_per_usd
    category: fx
    region: br
    pack_view: fx
    insight: Real per dollar. Brazil's commodity exports and domestic policy drive EM sentiment; tracks oil and iron ore.

  - id: DEXCHUS
    name: CNY per USD
    unit: cny_per_usd
    category: fx
    region: cn
    pack_view: fx
    insight: Official yuan per dollar. PBOC manages this band; divergence from offshore CNH signals capital flow pressure.

  - id: IRLTLT01DEM156N
    name: Germany 10Y
    unit: percent
    category: rates
    region: de
    pack_view: yield_bp
    show_on_live: false
    insight: OECD monthly German 10Y. Stamp as_of / lag_days; do not call it today's Bund yield.
    frequency: monthly

  - id: IRLTLT01GBM156N
    name: UK 10Y
    unit: percent
    category: rates
    region: uk
    pack_view: yield_bp
    show_on_live: false
    insight: OECD monthly UK 10Y. Stamp as_of / lag_days; do not call it today's gilt yield.
    frequency: monthly

  - id: IRLTLT01JPM156N
    name: Japan 10Y
    unit: percent
    category: rates
    region: jp
    pack_view: yield_bp
    show_on_live: false
    insight: OECD monthly JGB 10Y. Stamp as_of / lag_days; do not call it today's JGB yield.
    frequency: monthly
