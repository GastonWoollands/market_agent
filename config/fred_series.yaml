# FRED v1 levers for Live. Jobs upsert into macro_series / macro_observation.
# API: https://api.stlouisfed.org/fred/series/observations

series:
  - id: DGS10
    name: 10Y Treasury yield
    unit: percent
    category: rates
    insight: The discount rate on everything. Rising 10Y compresses long-duration valuations (tech, utilities, REITs).
    watch: [XLK, XLU, XLRE, XLF]

  - id: DGS2
    name: 2Y Treasury yield
    unit: percent
    category: rates
    insight: Front-end policy path. Tracks Fed funds expectations more tightly than the 10Y.

  - id: T10Y2Y
    name: Curve 10Y-2Y
    unit: percent
    category: rates
    insight: Yield curve slope. Inversion has historically preceded US recessions; steepening often marks policy easing.

  - id: DFII10
    name: 10Y real yield
    unit: percent
    category: rates
    insight: Inflation-adjusted discount rate. Higher real yields compete with equities and weigh on gold.

  - id: T10YIE
    name: 10Y breakeven
    unit: percent
    category: inflation
    insight: Market-implied average inflation over 10 years (nominal 10Y minus TIPS).

  - id: DFF
    name: Fed funds effective
    unit: percent
    category: rates
    insight: Overnight policy rate actually printed in the funds market.

  - id: VIXCLS
    name: VIX
    unit: index
    category: volatility
    insight: Implied 30-day S&P 500 vol. Sustained prints under ~15 are complacent; spikes mark risk-off.

  - id: BAMLH0A0HYM2
    name: HY OAS
    unit: percent
    category: credit
    insight: High-yield option-adjusted spread. Tight spreads = credit risk-on; widening is a stress signal.

  - id: DTWEXBGS
    name: Dollar (broad)
    unit: index
    category: fx
    insight: Trade-weighted USD. A strong dollar tightens global financial conditions.

  - id: DCOILWTICO
    name: WTI Crude
    unit: usd_per_barrel
    category: commodities
    insight: Spot WTI. Energy equities (XLE) and inflation prints track this with a lag.

  - id: CPIAUCSL
    name: CPI all items
    unit: index
    category: inflation
    insight: Headline CPI level. Monthly prints lag; use YoY/MoM in analytics, not the raw index on the tape.
    frequency: monthly

  - id: PCEPILFE
    name: Core PCE
    unit: index
    category: inflation
    insight: Fed's preferred inflation gauge excluding food and energy. Monthly, lags by design.
    frequency: monthly

  - id: UNRATE
    name: Unemployment rate
    unit: percent
    category: growth
    insight: U-3 unemployment. Labor softening is a late-cycle / easing signal.
    frequency: monthly
