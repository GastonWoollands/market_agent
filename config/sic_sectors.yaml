# SIC (SEC submissions `sic`) → the 11 sector names used by the tape sector ETFs.
# Applied by analytics/sectors.py; written to instrument.sector by jobs.ingest_sec_profile.
# `industry` stores the SEC `sicDescription` verbatim.
#
# This is an approximation of GICS, not GICS. Ranges are inclusive and the FIRST match
# wins, so narrow codes sit above the broad range they carve out of. `tickers` overrides
# names whose SIC predates the 2018 GICS reshuffle (internet media, payment networks).

tickers:
  GOOG: Communication Services
  GOOGL: Communication Services
  META: Communication Services
  NFLX: Communication Services
  V: Financials
  MA: Financials
  PYPL: Financials
  AMZN: Consumer Discretionary
  # SIC 7389 "business services, NEC" lumps payments, marketplaces and data vendors.
  FIS: Financials
  FISV: Financials
  GPN: Financials
  CPAY: Financials
  WEX: Financials
  WU: Financials
  FOUR: Financials
  MSCI: Financials
  EBAY: Consumer Discretionary
  ETSY: Consumer Discretionary
  MELI: Consumer Discretionary
  DASH: Consumer Discretionary
  CART: Consumer Staples
  Z: Real Estate
  CSGP: Real Estate
  AKAM: Information Technology
  FICO: Information Technology
  ACN: Information Technology
  # Online travel and cruise lines file as transportation.
  BKNG: Consumer Discretionary
  EXPE: Consumer Discretionary
  CCL: Consumer Discretionary
  RCL: Consumer Discretionary
  NCLH: Consumer Discretionary

ranges:
  # Agriculture, forestry, fishing
  - { from: 100, to: 999, sector: Consumer Staples }
  # Mining
  - { from: 1000, to: 1099, sector: Materials }
  - { from: 1200, to: 1399, sector: Energy }
  - { from: 1400, to: 1499, sector: Materials }
  # Construction (homebuilders sit with Consumer Discretionary)
