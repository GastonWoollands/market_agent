# Curated Polymarket slots for Live + Outlook.
# Gamma API (unauthenticated): GET https://gamma-api.polymarket.com/events/slug/{slug}
# Ingest resolves the current open event from query + slug_prefix. Optional `slug` is only a
# seed for the first fetch — do not edit this file when a monthly/FOMC contract expires.
# Ingest stores implied probability; UI must label these as market-implied, not forecasts.

events:
  - slot: front_fomc
    label: Next FOMC
    short_label: Next FOMC
    category: rates
    show_on_live: true
    query: fed decision
    slug_prefix: fed-decision-in-
    pick: soonest_end
    slug: fed-decision-in-september-762
    notes: Nested Yes/No markets (cut/hold/hike). Live shows the most likely path.

  - slot: next_fomc
    label: Fed path (following meeting)
    category: rates
    show_on_live: false
    query: fed decision
    slug_prefix: fed-decision-in-
    pick: second_soonest_end
    slug: fed-decision-in-october-20260617190323537
    notes: Optional second meeting. Skip in UI if inactive.

  - slot: cuts_year
    label: Fed cuts
    short_label: Fed cuts
    category: rates
    show_on_live: false
    query: fed rate cuts
    slug_prefix: how-many-fed-rate-cuts-in-
    pick: soonest_end
    slug: how-many-fed-rate-cuts-in-2026
    notes: Bucket market. Stored for Outlook; not on the Live strip.

  - slot: core_cpi_yoy
    label: Core CPI YoY
    short_label: Core CPI
    category: inflation
    show_on_live: true
    query: core cpi
    slug_prefix: core-cpi-yoy-
    pick: soonest_end
    slug: core-cpi-yoy-august-2026-1786474662954
    notes: YoY only (not MoM). Ingest rotates after the print.

  - slot: recession
    label: Recession
    short_label: Recession
    category: growth
    show_on_live: true
    query: us recession
    slug_prefix: us-recession-by-end-of-
    pick: soonest_end
    slug: us-recession-by-end-of-2026
    notes: Definition is market-specific (NBER vs two-quarter). Show question text in UI.

# Fallback queries if a slot omits `query`. Resolver still requires slug_prefix.
search_hints:
  rates: ["fed decision", "fomc", "fed rate cuts"]
  inflation: ["core cpi", "us inflation"]
  growth: ["us recession"]
  geo: ["iran", "taiwan", "ukraine", "tariff"]
