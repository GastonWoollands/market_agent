[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "market-agent"
version = "0.1.0"
description = "Personal US market research terminal"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14",
  "fastapi>=0.115",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "psycopg[binary]>=3.2",
  "pyyaml>=6.0",
  "httpx>=0.28",
  "yfinance==1.6.0",
  "anthropic>=0.70",
  "google-genai>=1.40",
  "sqlalchemy>=2.0.36",
  "uvicorn[standard]>=0.34",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28",
  "pytest>=8.3",
  "ruff>=0.9",
]

[project.scripts]
market-seed = "jobs.seed_tape:main"
market-yahoo = "jobs.ingest_yahoo:main"
market-fred = "jobs.ingest_fred:main"
market-poly = "jobs.ingest_polymarket:main"
market-dynamics = "jobs.compute_dynamics:main"
market-news = "jobs.ingest_news:main"
market-calendar = "jobs.ingest_calendar:main"
market-pack = "jobs.build_pack:main"
market-outlook = "jobs.generate_outlook:main"
market-sec = "jobs.ingest_sec:main"
market-valuation = "jobs.compute_valuation:main"
market-scores = "jobs.compute_scores:main"
market-memos = "jobs.generate_memos:main"
market-intraday = "jobs.ingest_intraday:main"
market-backfill = "jobs.backfill:main"

[tool.setuptools.packages.find]
include = ["api*", "store*", "jobs*", "ingest*", "analytics*", "agent*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"api/**.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
